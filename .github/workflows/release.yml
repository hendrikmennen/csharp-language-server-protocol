name: release

# Builds, packs and publishes the OneWare-branded NuGet packages.
#
#   OneWare.OmniSharp.Extensions.LanguageProtocol   <- the two packages consumed by the app
#   OneWare.OmniSharp.Extensions.LanguageClient     <-
#   OneWare.OmniSharp.Extensions.JsonRpc            \
#   OneWare.OmniSharp.Extensions.JsonRpc.Generators  |  required transitive closure,
#   OneWare.OmniSharp.Extensions.LanguageServer.Shared  |  must be published together
#   OneWare.OmniSharp.Extensions.LanguageServer     /   (optional, but keeps the graph whole)
#
# Assembly names and namespaces are intentionally NOT renamed, so consuming projects
# only need to swap the PackageReference id.
#
# Required repository secret: NUGET_API_SECRET (an api.nuget.org key scoped to OneWare.*)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build, e.g. 1.0.0 or 1.0.0-preview.1'
        required: true
        type: string
      publish:
        description: 'Push the packages to nuget.org'
        required: true
        default: false
        type: boolean

permissions:
  contents: write

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
  NUGET_PACKAGES: '${{ github.workspace }}/.nuget/packages'

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🔖 Resolve version
        id: version
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            version="${{ inputs.version }}"
          else
            # refs/tags/v1.2.3 -> 1.2.3
            version="${GITHUB_REF_NAME#v}"
          fi
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([-+].+)?$'; then
            echo "::error::'$version' is not a valid SemVer version (expected e.g. 1.0.0 or 1.0.0-preview.1)"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Building version $version"

      - name: 🔨 Use .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: 💾 Restore NuGet cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/Directory.Packages.props') }}
          restore-keys: ${{ runner.os }}-nuget-

      - name: 🎁 Restore
        run: dotnet restore LSP.sln

      - name: ⚙️ Build
        run: dotnet build LSP.sln -c Release --no-restore -p:OneWarePackageVersion=${{ steps.version.outputs.version }}

      - name: 💨 Test
        run: dotnet test LSP.sln -c Release --no-build --logger "trx;LogFileName=test-results.trx"

      - name: 📦 Pack
        run: |
          set -euo pipefail
          projects=(
            src/JsonRpc.Generators/JsonRpc.Generators.csproj
            src/JsonRpc/JsonRpc.csproj
            src/Protocol/Protocol.csproj
            src/Shared/Shared.csproj
            src/Client/Client.csproj
            src/Server/Server.csproj
          )
          for project in "${projects[@]}"; do
            dotnet pack "$project" \
              -c Release \
              --no-build \
              -o artifacts/nuget \
              -p:OneWarePackageVersion=${{ steps.version.outputs.version }}
          done
          ls -l artifacts/nuget

      - name: 🏺 Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: nuget
          path: artifacts/nuget/
          if-no-files-found: error

      - name: 🏺 Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/*.trx'
          if-no-files-found: ignore

  publish:
    needs: build
    runs-on: ubuntu-latest
    # Tag pushes always publish; manual runs only when explicitly asked to.
    if: startsWith(github.ref, 'refs/tags/v') || inputs.publish
    steps:
      - name: 🏺 Download packages
        uses: actions/download-artifact@v4
        with:
          name: nuget
          path: artifacts/nuget

      - name: 🔨 Use .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: 🚀 Push to nuget.org
        env:
          NUGET_API_SECRET: ${{ secrets.NUGET_API_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${NUGET_API_SECRET:-}" ]; then
            echo "::error::The NUGET_API_SECRET secret is not configured"
            exit 1
          fi
          dotnet nuget push "artifacts/nuget/*.nupkg" \
            --source https://api.nuget.org/v3/index.json \
            --api-key "$NUGET_API_SECRET" \
            --skip-duplicate

      - name: 📝 Create GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: v${{ needs.build.outputs.version }}
          generate_release_notes: true
          files: artifacts/nuget/*.nupkg
